<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Oneclicktripp — From stays to the whole trip</title>
<meta name="description" content="OneClickStays is now OneClickTripp. Bigger journeys, more options, same trust: flights, stays and experiences in one place.">
<meta name="theme-color" content="#FCF4EA">
<meta http-equiv="Cache-Control" content="no-cache">
<!-- build v4 -->
<meta property="og:title" content="Oneclicktripp — From stays to the whole trip">
<meta property="og:description" content="OneClickStays is now OneClickTripp. Flights · Stays · Experiences, in one place.">
<meta property="og:image" content="https://www.oneclicktripp.com/desktop.jpg">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 200 200'%3E%3Crect width='200' height='200' rx='44' fill='%23FFB401'/%3E%3Cg fill='none' stroke='%23fff' stroke-width='14' stroke-linecap='round'%3E%3Cpath d='M46.5 132 A64 64 0 1 1 153.5 132 A64 64 0 0 1 46.5 132'/%3E%3Cpath d='M66 115 A34 34 0 0 1 134 115'/%3E%3Cpath d='M86 115 A14 14 0 0 1 114 115'/%3E%3Cpath d='M46.5 132 H142'/%3E%3C/g%3E%3C/svg%3E">
<link rel="preload" as="image" href="desktop.jpg?v=3" media="(orientation: landscape)">
<link rel="preload" as="image" href="mobile.jpg?v=3" media="(orientation: portrait)">
<link rel="preconnect" href="https://api.fontshare.com" crossorigin>
<link href="https://api.fontshare.com/v2/css?f[]=general-sans@500,600,700&display=swap" rel="stylesheet">
<style>
  :root{--orange:#FFB401;--ink:#111;--ease:cubic-bezier(.22,.8,.26,1)}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;background:#FCF4EA;overflow:hidden}
  body{font-family:"General Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased;color:var(--ink)}

  /* letterbox fill: blurred artwork on landscape, flat cream on portrait */
  .backdrop{position:fixed;inset:-40px;background:url(desktop.jpg?v=3) center/cover no-repeat;filter:blur(30px) brightness(1.02);transform:scale(1.1);opacity:.9}

  /* the artwork, fitted to the viewport at its own aspect ratio */
  .scene{
    position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);
    aspect-ratio:1672/941;width:min(100vw, calc(100dvh * 1672 / 941));
    background:url(desktop.jpg?v=3) center/100% 100% no-repeat;
    container-type:inline-size;
    /* overlay geometry (% of artwork) — desktop */
    --bar-l:7.06%; --bar-t:57.17%; --bar-w:28.71%; --bar-h:5.10%;
    --track:#F6E9DE; --paper:#FAF1E7;
    --lbl-l:36.4%; --lbl-t:56.7%; --lbl-w:5.4%; --lbl-h:4.2%; --lbl-fs:1.85cqw;
    --pill-l:79.25%; --pill-t:3.51%; --pill-w:17.34%; --pill-h:5.74%; --pill-fs:1.32cqw; --pill-bg:#FEF7F0;
    --plane:2.1cqw;
  }
  @media (orientation: portrait){
    html,body{background:#FDF8F3;overflow:auto;height:auto;min-height:100dvh}
    body{display:flex;align-items:center;justify-content:center;min-height:100dvh}
    .backdrop{display:none}
    /* phones: fill the full width, scroll a little if the viewport is shorter */
    .scene{
      position:relative;left:auto;top:auto;transform:none;
      aspect-ratio:716/1504;width:100vw;max-width:none;
      background-image:url(mobile.jpg?v=3);
      --bar-l:4.61%; --bar-t:72.34%; --bar-w:60.61%; --bar-h:2.93%;
      --track:#FCEFE1; --paper:#FDF7F0;
      --lbl-l:66.8%; --lbl-t:72.0%; --lbl-w:12%; --lbl-h:3.6%; --lbl-fs:4.5cqw;
      --pill-l:16.34%; --pill-t:92.95%; --pill-w:67.18%; --pill-h:4.72%; --pill-fs:4.6cqw; --pill-bg:#FEFAF5;
      --plane:5.2cqw;
    }
  }

  /* ── live progress bar (covers the painted one) ───────────── */
  .bar{
    position:absolute;left:calc(var(--bar-l) - .2%);top:calc(var(--bar-t) - .3%);
    width:calc(var(--bar-w) + .4%);height:calc(var(--bar-h) + .6%);
    border-radius:999px;padding:.3cqw;background:var(--track);
    border:.22cqw solid #fff;box-shadow:0 .15cqw .6cqw rgba(60,40,10,.10);
  }
  @media (orientation: portrait){.bar{padding:.7cqw;border-width:.5cqw}}
  .fill{
    position:relative;height:100%;width:0;border-radius:999px;
    background:linear-gradient(90deg,#FFC21A,#FFB401);
    transition:width 2.4s var(--ease);
  }
  .fill::after{content:"";position:absolute;inset:0;border-radius:inherit;background:linear-gradient(100deg,transparent 40%,rgba(255,255,255,.5) 50%,transparent 60%) no-repeat;background-size:300% 100%;background-position:200% 0;animation:shine 3s ease-in-out 3.4s infinite}
  @keyframes shine{from{background-position:200% 0}to{background-position:-100% 0}}
  .plane{position:absolute;right:-.3cqw;top:50%;width:var(--plane);height:var(--plane);transform:translateY(-50%);fill:#111}

  /* percentage label, on an opaque paper patch that hides the painted one */
  .lbl{
    position:absolute;left:var(--lbl-l);top:var(--lbl-t);width:var(--lbl-w);height:var(--lbl-h);
    background:var(--paper);display:flex;align-items:center;justify-content:flex-start;
    font-weight:700;font-size:var(--lbl-fs);letter-spacing:-.02em;font-variant-numeric:tabular-nums;color:#111;
  }

  /* ── live countdown pill (covers the painted one) ─────────── */
  .pill{
    position:absolute;left:var(--pill-l);top:var(--pill-t);width:var(--pill-w);height:var(--pill-h);
    display:flex;align-items:center;justify-content:center;gap:.6em;
    border-radius:999px;background:var(--pill-bg);border:.14cqw solid var(--orange);
    font-weight:500;font-size:var(--pill-fs);letter-spacing:-.01em;white-space:nowrap;color:#111;
  }
  @media (orientation: portrait){.pill{border-width:.32cqw}}
  .pill b{color:var(--orange);font-weight:700}
  .pill svg{width:1.05em;height:1.05em;fill:none;stroke:#111;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

  .bar,.lbl,.pill{animation:pop .6s var(--ease) both}
  .pill{animation-delay:.3s}
  @keyframes pop{from{opacity:0}to{opacity:1}}

  .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
  @media (prefers-reduced-motion:reduce){
    *,*::before,*::after{animation-duration:.01ms !important;animation-delay:0s !important;animation-iteration-count:1 !important;transition-duration:.01ms !important}
  }
</style>
</head>
<body>
<div class="backdrop" aria-hidden="true"></div>

<main class="scene" role="img" aria-label="Oneclicktripp — From stays to the whole trip. OneClickStays is now OneClickTripp. Bigger journeys, more options, same trust. Flights, Stays, Experiences.">
  <div class="bar" role="progressbar" aria-label="Migrating our platform" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" id="progress">
    <div class="fill" id="fill">
      <svg class="plane" viewBox="0 0 24 24" aria-hidden="true"><path d="M21.9 3.1c-1.4-1.4-3.7-1.4-5.1 0L13 6.9 4.6 4.6c-.5-.1-1 0-1.4.4L2.5 5.7c-.5.5-.4 1.3.2 1.7L9 11.7l-3.3 3.3-2.1-.4c-.4-.1-.8 0-1.1.3l-.6.6c-.5.5-.4 1.3.2 1.6l3.4 2 2 3.4c.3.6 1.1.7 1.6.2l.6-.6c.3-.3.4-.7.3-1.1l-.4-2.1 3.3-3.3 4.3 6.3c.4.6 1.2.7 1.7.2l.7-.7c.4-.4.5-.9.4-1.4L17.1 11l3.8-3.8c1.4-1.4 1.4-3.7 0-5.1z" transform="rotate(45 12 12)"/></svg>
    </div>
  </div>
  <div class="lbl" id="pct">0%</div>

  <div class="pill" id="live">
    <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4M8 14h.01M12 14h.01M16 14h.01M8 18h.01M12 18h.01M16 18h.01"/></svg>
    <span id="liveText">Going Live <b>Soon</b></span>
  </div>
</main>

<p class="sr">Contact: reservations@oneclicktripp.com · +91 98999 92197</p>

<script>
  // ── Edit these two values ──────────────────────────────────
  var LAUNCH_DATE = '2026-11-09';   // ISO date. Set to '' to show "Going Live Soon".
  var PROGRESS    = 62;             // percentage shown on the migration bar
  // ───────────────────────────────────────────────────────────
  (function(){
    var reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
    var fill = document.getElementById('fill'), pct = document.getElementById('pct'), bar = document.getElementById('progress');
    function run(){
      fill.style.width = PROGRESS + '%';
      bar.setAttribute('aria-valuenow', PROGRESS);
      if (reduce){ pct.textContent = PROGRESS + '%'; return; }
      var t0 = null, dur = 2400;
      function step(ts){
        if(!t0) t0 = ts;
        var p = Math.min(1,(ts - t0)/dur); p = 1 - Math.pow(1 - p, 3);
        pct.textContent = Math.round(PROGRESS * p) + '%';
        if (p < 1) requestAnimationFrame(step);
      }
      requestAnimationFrame(step);
    }
    setTimeout(run, reduce ? 0 : 500);

    var el = document.getElementById('liveText');
    if (LAUNCH_DATE){
      var now = new Date(); now.setHours(0,0,0,0);
      var p = LAUNCH_DATE.split('-'), launch = new Date(p[0], p[1]-1, p[2]);
      var days = Math.round((launch - now)/86400000);
      if (days > 1)        el.innerHTML = 'Going Live in <b>' + days + ' Days</b>';
      else if (days === 1) el.innerHTML = 'Going Live <b>Tomorrow</b>';
      else                 el.innerHTML = 'Going Live <b>Today</b>';
    }
  })();
</script>
</body>
</html>
