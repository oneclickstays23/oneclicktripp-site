<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Oneclicktripp — A bigger travel universe arrives soon</title>
<meta name="description" content="From OneClickStays to OneClickTripp. Flights, stays and experiences all in one place. Launching 10 November.">
<meta name="theme-color" content="#FCF6F1">
<meta http-equiv="Cache-Control" content="no-cache">
<!-- build v5 -->
<meta property="og:title" content="Oneclicktripp — A bigger travel universe arrives soon">
<meta property="og:description" content="From OneClickStays to OneClickTripp. Flights · Stays · Experiences, all in one place.">
<meta property="og:image" content="https://www.oneclicktripp.com/desktop.jpg?v=5">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 200 200'%3E%3Crect width='200' height='200' rx='44' fill='%23FFB401'/%3E%3Cg fill='none' stroke='%23fff' stroke-width='14' stroke-linecap='round'%3E%3Cpath d='M46.5 132 A64 64 0 1 1 153.5 132 A64 64 0 0 1 46.5 132'/%3E%3Cpath d='M66 115 A34 34 0 0 1 134 115'/%3E%3Cpath d='M86 115 A14 14 0 0 1 114 115'/%3E%3Cpath d='M46.5 132 H142'/%3E%3C/g%3E%3C/svg%3E">
<link rel="preload" as="image" href="desktop.jpg?v=5" media="(orientation: landscape)">
<link rel="preload" as="image" href="mobile.jpg?v=5" media="(orientation: portrait)">
<link rel="preconnect" href="https://api.fontshare.com" crossorigin>
<link href="https://api.fontshare.com/v2/css?f[]=general-sans@500,600,700&display=swap" rel="stylesheet">
<style>
  :root{--orange:#FFB401;--ink:#111;--ease:cubic-bezier(.22,.8,.26,1)}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;background:#FCF6F1;overflow:hidden}
  body{font-family:"General Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased;color:var(--ink)}

  .backdrop{position:fixed;inset:-40px;background:url(desktop.jpg?v=5) center/cover no-repeat;filter:blur(30px) brightness(1.02);transform:scale(1.1);opacity:.9}

  /* the artwork, fitted to the viewport at its own aspect ratio */
  .scene{
    position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);
    aspect-ratio:1672/941;width:min(100vw, calc(100dvh * 1672 / 941));
    background:url(desktop.jpg?v=5) center/100% 100% no-repeat;
    container-type:inline-size;
    /* overlay geometry (% of artwork) — desktop */
    --bar-l:4.90%; --bar-t:67.48%; --bar-w:30.98%; --bar-h:4.25%; --track:#FAF4EE;
    --lbl-l:36.6%; --lbl-t:67.0%; --lbl-w:5.4%; --lbl-h:5%; --lbl-fs:2.05cqw; --paper:#FCF6F1;
    --num-l:8.0%; --num-t:82.4%; --num-w:8.3%; --num-h:10.6%; --num-fs:6.4cqw; --num-rot:-2.5deg; --ticket:#FBF6EE;
    --pill-l:75.96%; --pill-t:3.4%; --pill-w:19.86%; --pill-h:5.31%; --pill-fs:1.32cqw; --pill-bg:#FBF5F1; --pill-show:flex;
    --plane:2.1cqw;
  }
  @media (orientation: portrait){
    html,body{background:#FCF7F2;overflow:auto;height:auto;min-height:100dvh}
    body{display:flex;align-items:center;justify-content:center;min-height:100dvh}
    .backdrop{display:none}
    .scene{
      position:relative;left:auto;top:auto;transform:none;
      aspect-ratio:706/1490;width:100vw;max-width:none;
      background-image:url(mobile.jpg?v=5);
      --bar-l:4.53%; --bar-t:41.07%; --bar-w:78.33%; --bar-h:2.68%; --track:#FCF7F2;
      --lbl-l:84.2%; --lbl-t:40.7%; --lbl-w:15%; --lbl-h:3.4%; --lbl-fs:5.8cqw; --paper:#FCF7F2;
      --num-l:6.8%; --num-t:50.6%; --num-w:17%; --num-h:5.6%; --num-fs:12.4cqw; --num-rot:-3deg; --ticket:#FDF8F1;
      --pill-show:none;
      --plane:5.2cqw;
    }
  }

  /* ── live progress bar ─────────────────────────────────────── */
  .bar{
    position:absolute;left:calc(var(--bar-l) - .2%);top:calc(var(--bar-t) - .3%);
    width:calc(var(--bar-w) + .4%);height:calc(var(--bar-h) + .6%);
    border-radius:999px;padding:.3cqw;background:var(--track);
    border:.22cqw solid #fff;box-shadow:0 .15cqw .6cqw rgba(60,40,10,.10);
  }
  @media (orientation: portrait){.bar{padding:.7cqw;border-width:.5cqw}}
  .fill{position:relative;height:100%;width:0;border-radius:999px;background:linear-gradient(90deg,#FFC21A,#FFB401);transition:width 2.4s var(--ease)}
  .fill::after{content:"";position:absolute;inset:0;border-radius:inherit;background:linear-gradient(100deg,transparent 40%,rgba(255,255,255,.5) 50%,transparent 60%) no-repeat;background-size:300% 100%;background-position:200% 0;animation:shine 3s ease-in-out 3.4s infinite}
  @keyframes shine{from{background-position:200% 0}to{background-position:-100% 0}}
  .plane{position:absolute;right:-.3cqw;top:50%;width:var(--plane);height:var(--plane);transform:translateY(-50%);fill:#111}

  /* percentage label on a paper patch */
  .lbl{position:absolute;left:var(--lbl-l);top:var(--lbl-t);width:var(--lbl-w);height:var(--lbl-h);background:var(--paper);display:flex;align-items:center;font-weight:700;font-size:var(--lbl-fs);letter-spacing:-.02em;font-variant-numeric:tabular-nums}

  /* days number on the ticket (the word "Days" stays painted) */
  .num{
    position:absolute;left:var(--num-l);top:var(--num-t);width:var(--num-w);height:var(--num-h);
    background:var(--ticket);transform:rotate(var(--num-rot));transform-origin:center;
    display:flex;align-items:center;justify-content:flex-start;
    font-weight:700;font-size:var(--num-fs);letter-spacing:-.04em;line-height:1;font-variant-numeric:tabular-nums;color:#111;
  }

  /* top-right pill (desktop only) */
  .pill{
    position:absolute;left:var(--pill-l);top:var(--pill-t);width:var(--pill-w);height:var(--pill-h);
    display:var(--pill-show);align-items:center;justify-content:center;gap:.6em;
    border-radius:999px;background:var(--pill-bg);border:.14cqw solid var(--orange);
    font-weight:500;font-size:var(--pill-fs);letter-spacing:-.01em;white-space:nowrap;color:#111;
  }
  .pill b{color:var(--orange);font-weight:700}
  .pill svg{width:1.05em;height:1.05em;fill:none;stroke:#111;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

  .bar,.lbl,.num,.pill{animation:pop .6s var(--ease) both}
  @keyframes pop{from{opacity:0}to{opacity:1}}
  .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
  @media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms !important;animation-delay:0s !important;animation-iteration-count:1 !important;transition-duration:.01ms !important}}
</style>
</head>
<body>
<div class="backdrop" aria-hidden="true"></div>

<main class="scene" role="img" aria-label="Oneclicktripp — The final stretch. A bigger travel universe arrives soon. From OneClickStays to OneClickTripp: flights, stays and experiences all in one place.">
  <div class="bar" role="progressbar" aria-label="Migrating our platform" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" id="progress">
    <div class="fill" id="fill">
      <svg class="plane" viewBox="0 0 24 24" aria-hidden="true"><path d="M21.9 3.1c-1.4-1.4-3.7-1.4-5.1 0L13 6.9 4.6 4.6c-.5-.1-1 0-1.4.4L2.5 5.7c-.5.5-.4 1.3.2 1.7L9 11.7l-3.3 3.3-2.1-.4c-.4-.1-.8 0-1.1.3l-.6.6c-.5.5-.4 1.3.2 1.6l3.4 2 2 3.4c.3.6 1.1.7 1.6.2l.6-.6c.3-.3.4-.7.3-1.1l-.4-2.1 3.3-3.3 4.3 6.3c.4.6 1.2.7 1.7.2l.7-.7c.4-.4.5-.9.4-1.4L17.1 11l3.8-3.8c1.4-1.4 1.4-3.7 0-5.1z" transform="rotate(45 12 12)"/></svg>
    </div>
  </div>
  <div class="lbl" id="pct">0%</div>
  <div class="num" id="days" aria-label="Launching in">05</div>

  <div class="pill" id="live">
    <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4M8 14h.01M12 14h.01M16 14h.01M8 18h.01M12 18h.01M16 18h.01"/></svg>
    <span id="liveText">Launching on <b>10th Nov</b></span>
  </div>
</main>

<p class="sr">Contact: reservations@oneclicktripp.com · +91 98999 92197</p>

<script>
  // ── Edit these two values ──────────────────────────────────
  var LAUNCH_DATE = '2026-11-10';   // ISO date of launch
  var PROGRESS    = 90;             // percentage shown on the migration bar
  // ───────────────────────────────────────────────────────────
  (function(){
    var reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
    var fill = document.getElementById('fill'), pct = document.getElementById('pct'), bar = document.getElementById('progress');
    function run(){
      fill.style.width = PROGRESS + '%';
      bar.setAttribute('aria-valuenow', PROGRESS);
      if (reduce){ pct.textContent = PROGRESS + '%'; return; }
      var t0 = null, dur = 2400;
      function step(ts){
        if(!t0) t0 = ts;
        var p = Math.min(1,(ts - t0)/dur); p = 1 - Math.pow(1 - p, 3);
        pct.textContent = Math.round(PROGRESS * p) + '%';
        if (p < 1) requestAnimationFrame(step);
      }
      requestAnimationFrame(step);
    }
    setTimeout(run, reduce ? 0 : 500);

    var p = LAUNCH_DATE.split('-'), launch = new Date(p[0], p[1]-1, p[2]);
    var now = new Date(); now.setHours(0,0,0,0);
    var days = Math.max(0, Math.round((launch - now)/86400000));
    document.getElementById('days').textContent = (days < 10 ? '0' : '') + days;

    var d = launch.getDate(), s = (d%10==1&&d!=11)?'st':(d%10==2&&d!=12)?'nd':(d%10==3&&d!=13)?'rd':'th';
    var months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
    document.getElementById('liveText').innerHTML = 'Launching on <b>' + d + s + ' ' + months[launch.getMonth()] + '</b>';
  })();
</script>
</body>
</html>
