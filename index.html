<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Oneclicktripp — We're upgrading your travel experience</title>
<meta name="description" content="From Oneclickstays to Oneclicktripp. Now more than stays: your complete trip — flights, stays and experiences — in one place.">
<meta name="theme-color" content="#1b2130">
<meta property="og:title" content="Oneclicktripp — We're upgrading your travel experience">
<meta property="og:description" content="From Oneclickstays to Oneclicktripp. Flights · Stays · Experiences, in one place.">
<meta property="og:image" content="https://oneclicktripp.com/desktop.jpg">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 200 200'%3E%3Crect width='200' height='200' rx='44' fill='%23FFB401'/%3E%3Cg fill='none' stroke='%23fff' stroke-width='14' stroke-linecap='round'%3E%3Cpath d='M46.5 132 A64 64 0 1 1 153.5 132 A64 64 0 0 1 46.5 132'/%3E%3Cpath d='M66 115 A34 34 0 0 1 134 115'/%3E%3Cpath d='M86 115 A14 14 0 0 1 114 115'/%3E%3Cpath d='M46.5 132 H142'/%3E%3C/g%3E%3C/svg%3E">
<link rel="preload" as="image" href="desktop.jpg" media="(orientation: landscape)">
<link rel="preload" as="image" href="mobile.jpg" media="(orientation: portrait)">
<link rel="preconnect" href="https://api.fontshare.com" crossorigin>
<link href="https://api.fontshare.com/v2/css?f[]=general-sans@500,600,700&display=swap" rel="stylesheet">
<style>
  :root{--orange:#FFB401;--ease:cubic-bezier(.22,.8,.26,1)}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;background:#1b2130;overflow:hidden}
  body{font-family:"General Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased;color:#fff}

  /* blurred copy of the artwork fills any letterbox */
  .backdrop{position:fixed;inset:-40px;background:url(desktop.jpg) center/cover no-repeat;filter:blur(28px) brightness(.85);transform:scale(1.1)}

  /* the artwork, fitted to the viewport, keeps its own aspect ratio */
  .scene{
    position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);
    aspect-ratio:1672/941;width:min(100vw, calc(100dvh * 1672 / 941));
    background:url(desktop.jpg) center/100% 100% no-repeat;
    container-type:inline-size;
    box-shadow:0 0 120px rgba(0,0,0,.35);
    /* overlay geometry, % of the artwork (desktop) */
    --bar-l:26.85%; --bar-t:54.62%; --bar-w:47.13%; --bar-h:5.53%;
    --pill-l:38.28%; --pill-t:82.68%; --pill-w:23.92%; --pill-h:7.44%;
    --bar-fs:1.45cqw; --pill-fs:1.55cqw; --pad:.9cqw;
  }
  @media (orientation: portrait){
    .backdrop{background-image:url(mobile.jpg)}
    .scene{
      aspect-ratio:941/1672;width:min(100vw, calc(100dvh * 941 / 1672));
      background-image:url(mobile.jpg);
      --bar-l:10.84%; --bar-t:44.44%; --bar-w:79.06%; --bar-h:3.35%;
      --pill-l:23.38%; --pill-t:64.11%; --pill-w:53.99%; --pill-h:4.78%;
      --bar-fs:3cqw; --pill-fs:3.3cqw; --pad:1.6cqw;
    }
  }

  /* ── live progress bar (covers the painted one) ───────────── */
  .bar{
    position:absolute;left:calc(var(--bar-l) - .25%);top:calc(var(--bar-t) - .35%);
    width:calc(var(--bar-w) + .5%);height:calc(var(--bar-h) + .7%);
    border-radius:999px;padding:.38cqw;
    background:linear-gradient(90deg,rgba(255,236,205,.96),rgba(236,228,230,.96) 60%,rgba(222,214,226,.97));border:.18cqw solid rgba(255,255,255,.95);
    box-shadow:0 .6cqw 2.4cqw rgba(40,20,0,.25), inset 0 0 1.2cqw rgba(255,255,255,.35);
  }
  .fill{
    position:relative;height:100%;width:0;border-radius:999px;
    background:linear-gradient(90deg,#FFD24A 0%,#FFB401 70%,#FF9F00 100%);
    box-shadow:0 0 1.6cqw rgba(255,190,20,.9), 0 0 3cqw rgba(255,160,0,.45);
    transition:width 2.4s var(--ease);
  }
  .fill::after{content:"";position:absolute;inset:0;border-radius:inherit;background:linear-gradient(100deg,transparent 40%,rgba(255,255,255,.55) 50%,transparent 60%) no-repeat;background-size:300% 100%;background-position:200% 0;animation:shine 2.8s ease-in-out 3.4s infinite}
  @keyframes shine{from{background-position:200% 0}to{background-position:-100% 0}}
  .plane{
    position:absolute;right:-.2cqw;top:50%;width:2.2cqw;height:2.2cqw;transform:translate(0,-50%);
    fill:#111;filter:drop-shadow(0 .1cqw .3cqw rgba(0,0,0,.35));
  }
  @media (orientation: portrait){.plane{width:4.6cqw;height:4.6cqw}}
  .pct{position:absolute;right:1.1cqw;top:50%;transform:translateY(-50%);font-weight:600;font-size:var(--bar-fs);letter-spacing:-.01em;color:#fff;text-shadow:0 .1cqw .5cqw rgba(0,0,0,.35);font-variant-numeric:tabular-nums}
  @media (orientation: portrait){.pct{right:2.2cqw}}

  /* ── live countdown pill (covers the painted one) ─────────── */
  .pill{
    position:absolute;left:calc(var(--pill-l) - .3%);top:calc(var(--pill-t) - .4%);
    width:calc(var(--pill-w) + .6%);height:calc(var(--pill-h) + .8%);
    display:flex;align-items:center;justify-content:center;gap:.9cqw;
    border-radius:999px;color:#fff;font-weight:500;font-size:var(--pill-fs);letter-spacing:-.01em;white-space:nowrap;
    background:rgba(26,30,40,.97);border:.14cqw solid rgba(255,255,255,.7);
    box-shadow:0 1cqw 3cqw rgba(0,0,0,.35);
  }
  @media (orientation: portrait){.pill{gap:2cqw;border-width:.3cqw}}
  .pill b{color:var(--orange);font-weight:700}
  .pill svg{width:1.15em;height:1.15em;fill:none;stroke:var(--orange);stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;animation:spin 6s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}

  /* gentle entrance */
  .bar,.pill{animation:pop .7s var(--ease) both}
  .pill{animation-delay:.35s}
  @keyframes pop{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:none}}

  .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
  @media (prefers-reduced-motion:reduce){
    *,*::before,*::after{animation-duration:.01ms !important;animation-delay:0s !important;animation-iteration-count:1 !important;transition-duration:.01ms !important}
  }
</style>
</head>
<body>
<div class="backdrop" aria-hidden="true"></div>

<main class="scene" role="img" aria-label="Oneclicktripp — from Oneclickstays to Oneclicktripp. We're upgrading your travel experience. Now more than stays: your complete trip, in one place. Flights, Stays, Experiences.">
  <div class="bar" role="progressbar" aria-label="Migrating our platform" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" id="progress">
    <div class="fill" id="fill">
      <svg class="plane" viewBox="0 0 24 24" aria-hidden="true"><path d="M21.9 3.1c-1.4-1.4-3.7-1.4-5.1 0L13 6.9 4.6 4.6c-.5-.1-1 0-1.4.4L2.5 5.7c-.5.5-.4 1.3.2 1.7L9 11.7l-3.3 3.3-2.1-.4c-.4-.1-.8 0-1.1.3l-.6.6c-.5.5-.4 1.3.2 1.6l3.4 2 2 3.4c.3.6 1.1.7 1.6.2l.6-.6c.3-.3.4-.7.3-1.1l-.4-2.1 3.3-3.3 4.3 6.3c.4.6 1.2.7 1.7.2l.7-.7c.4-.4.5-.9.4-1.4L17.1 11l3.8-3.8c1.4-1.4 1.4-3.7 0-5.1z" transform="rotate(45 12 12)"/></svg>
    </div>
    <span class="pct" id="pct">0%</span>
  </div>

  <div class="pill" id="live">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12a9 9 0 0 1-15.5 6.2M3 12a9 9 0 0 1 15.5-6.2"/><path d="M21 4v5h-5M3 20v-5h5"/></svg>
    <span id="liveText">Going Live <b>Soon</b></span>
  </div>
</main>

<p class="sr">Contact: reservations@oneclicktripp.com · +91 98999 92197</p>

<script>
  // ── Edit these two values ──────────────────────────────────
  var LAUNCH_DATE = '2026-11-09';   // ISO date. Set to '' to show "Going Live Soon".
  var PROGRESS    = 62;             // percentage shown on the migration bar
  // ───────────────────────────────────────────────────────────
  (function(){
    var reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
    var fill = document.getElementById('fill'), pct = document.getElementById('pct'), bar = document.getElementById('progress');
    function run(){
      fill.style.width = PROGRESS + '%';
      bar.setAttribute('aria-valuenow', PROGRESS);
      if (reduce){ pct.textContent = PROGRESS + '%'; return; }
      var t0 = null, dur = 2400;
      function step(ts){
        if(!t0) t0 = ts;
        var p = Math.min(1,(ts - t0)/dur); p = 1 - Math.pow(1 - p, 3);
        pct.textContent = Math.round(PROGRESS * p) + '%';
        if (p < 1) requestAnimationFrame(step);
      }
      requestAnimationFrame(step);
    }
    setTimeout(run, reduce ? 0 : 600);

    var el = document.getElementById('liveText');
    if (LAUNCH_DATE){
      var now = new Date(); now.setHours(0,0,0,0);
      var p = LAUNCH_DATE.split('-'), launch = new Date(p[0], p[1]-1, p[2]);
      var days = Math.round((launch - now)/86400000);
      if (days > 1)        el.innerHTML = 'Going Live in <b>' + days + ' Days</b>';
      else if (days === 1) el.innerHTML = 'Going Live <b>Tomorrow</b>';
      else                 el.innerHTML = 'Going Live <b>Today</b>';
    }
  })();
</script>
</body>
</html>
